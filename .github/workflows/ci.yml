# Caminho: .github/workflows/ci.yml
# Roda a cada push e pull request: compila, executa todos os testes (inclusive os
# de integração com PostgreSQL via Testcontainers) e exige cobertura >= 80%.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O runner do GitHub já tem Docker, então o Testcontainers funciona sem configuração.
      - name: Build, testes e cobertura
        run: ./mvnw -B verify

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/
