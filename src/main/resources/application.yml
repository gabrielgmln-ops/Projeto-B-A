# Caminho: src/main/resources/application.yml

spring:
  application:
    name: ledger-api

  # Lê o arquivo .env da raiz do projeto como se fosse um .properties.
  # "optional:" = se o arquivo não existir (ex.: no CI ou em produção),
  # a aplicação usa as variáveis de ambiente reais do sistema.
  # IMPORTANTE: credenciais ficam no .env (fora do Git), nunca neste arquivo.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    # "validate": o Hibernate apenas CONFERE se as entidades batem com o schema.
    # Quem cria e altera tabelas é exclusivamente o Flyway.
    hibernate:
      ddl-auto: validate
    # Desliga o "Open Session in View": evita consultas escondidas ao banco
    # durante a serialização do JSON, um antipadrão clássico de performance.
    open-in-view: false

  flyway:
    enabled: true

  data:
    web:
      pageable:
        # Limite de itens por página: impede que alguém peça size=1000000 no extrato.
        max-page-size: 100

ledger:
  seguranca:
    # Usuários sintéticos de desenvolvimento, criados no startup (SeedUsuariosRunner).
    # As senhas vêm das variáveis SEED_* do .env e NUNCA ficam no código/Git.
    # Se vazio, o seed é ignorado e a aplicação sobe normalmente.
    seed:
      operador:
        username: ${SEED_OPERADOR_USERNAME:}
        senha: ${SEED_OPERADOR_SENHA:}
      cliente:
        username: ${SEED_CLIENTE_USERNAME:}
        senha: ${SEED_CLIENTE_SENHA:}
      cliente2:   # opcional
        username: ${SEED_CLIENTE2_USERNAME:}
        senha: ${SEED_CLIENTE2_SENHA:}
      gateway:    # opcional: conta de serviço do Gateway de Segurança (papel CLIENTE)
        username: ${SEED_GATEWAY_USERNAME:}
        senha: ${SEED_GATEWAY_SENHA:}
    # Defesa contra força bruta no login (bloqueio progressivo por usuário).
    login:
      max-tentativas: ${LOGIN_MAX_TENTATIVAS:5}
      bloqueio-base-segundos: ${LOGIN_BLOQUEIO_BASE_SEGUNDOS:60}
      bloqueio-maximo-segundos: ${LOGIN_BLOQUEIO_MAXIMO_SEGUNDOS:900}

  idempotencia:
    # Por quanto tempo uma chave reconhece repetições (formato Duration: 24h, 30m...).
    validade: ${IDEMPOTENCIA_VALIDADE:24h}
    # Quando a limpeza roda (cron do Spring: seg min hora dia mês dia-da-semana). Padrão: a cada hora.
    limpeza-cron: ${IDEMPOTENCIA_LIMPEZA_CRON:0 0 * * * *}

server:
  # Plataformas de deploy (Render, Railway...) informam a porta pela variável PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
